name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]

  schedule:
    - cron: '0 */6 * * *' 

env:
  DS5DONGLECONFIGWEB_REPO: awalol/ds5dongle-config-web
  DS5DONGLECONFIGWEB_BRANCH: master
  DS5DONGLECONFIGWEB_REF: 73d412e61483f7809fd578421bd6f43de2cee094

jobs:
  push_to_registry:
    permissions: write-all
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Get upstream repository HEAD SHA
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/awalol/ds5dongle-config-web.git HEAD | cut -f1)

          echo "sha=$SHA" >> $GITHUB_OUTPUT

          echo "Upstream SHA: $SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Retrieve current image SHA label
        id: current
        continue-on-error: true
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest || true

          CURRENT_SHA=$(docker inspect \
            ghcr.io/${{ github.repository }}:latest \
            --format '{{ index .Config.Labels "upstream.sha" }}' \
            2>/dev/null || true)

          echo "sha=$CURRENT_SHA" >> $GITHUB_OUTPUT

          echo "Current image SHA: $CURRENT_SHA"
      - name: Compare SHAs
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.current.outputs.sha }}" ]; then
            echo "build=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected."
          else
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Upstream changes detected."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.compare.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          build-args: |
            UPSTREAM_SHA=${{ steps.upstream.outputs.sha }}
          context: .
          push: true
          labels: |
            upstream.sha=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.run_number }}

      - name: Build skipped
        if: steps.compare.outputs.build == 'false'
        run: |
          echo "External repository has not changed."
          echo "Skipping Docker build."
