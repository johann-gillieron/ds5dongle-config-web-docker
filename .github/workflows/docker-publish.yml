name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]

  schedule:
    - cron: '0 0 * * *' 

env:
  DS5DONGLECONFIGWEB_REPO: awalol/ds5dongle-config-web
  DS5DONGLECONFIGWEB_BRANCH: master
  DS5DONGLECONFIGWEB_REF: 73d412e61483f7809fd578421bd6f43de2cee094
  

jobs:
  push_to_registry:
    permissions: write-all
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Get upstream SHA
        id: upstream
        run: |
          echo "sha=$(git ls-remote https://github.com/awalol/ds5dongle-config-web.git HEAD | cut -f1)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: |
            WEB_SHA=${{ steps.upstream.outputs.sha }}
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
